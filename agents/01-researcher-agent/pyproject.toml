[project]
name = "01-researcher-agent"
version = "0.1.0"
description = "MAF Researcher Agent"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "agent-framework==1.0.1",
  "azure-monitor-opentelemetry==1.8.7",
  "fastapi>=0.128.0",
  "uvicorn[standard]>=0.40.0",
  "pydantic>=2.12.5",
  "httpx>=0.28.1",
  "openai>=2.16.0",
  "PyJWT[crypto]>=2.10.1",
]

[project.optional-dependencies]
test = ["pytest>=9.0.2"]
dev = [
  "ruff>=0.14.14",
  "black>=26.1.0",
  "isort>=7.0.0",
  "pre-commit>=4.5.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
