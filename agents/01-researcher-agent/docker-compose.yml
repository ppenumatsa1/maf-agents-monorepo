services:
  researcher-agent:
    container_name: ${CONTAINER_NAME:-researcher-agent-local}
    image: ${IMAGE:-researcher-agent}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      REQUIRE_AUTH: "${REQUIRE_AUTH:-false}"
      ENABLE_TELEMETRY: "${ENABLE_TELEMETRY:-false}"
      AZURE_CONFIG_DIR: "/home/app/.azure"
    volumes:
      - ./app:/app/app:rw
      - ${HOME:-/tmp}/.azure:/home/app/.azure
    command:
      [
        "uvicorn",
        "app.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    restart: unless-stopped
