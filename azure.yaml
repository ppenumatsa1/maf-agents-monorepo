# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: maf-agents-monorepo
metadata:
  template: custom
hooks:
  preprovision:
    shell: sh
    run: ./infra/hooks/preprovision.sh
    continueOnError: false
  postprovision:
    shell: sh
    run: ./infra/hooks/postprovision.sh
    continueOnError: false
services:
  researcher-agent:
    project: ./agents/01-researcher-agent
    language: python
    host: containerapp
    resourceName: researcher-agent
    image: researcher-agent
    docker:
      path: ./Dockerfile
      context: .
    hooks:
      predeploy:
        shell: sh
        run: ./hooks/predeploy.sh
        continueOnError: false
infra:
  path: infra
  parameters:
    requireAuth: ${REQUIRE_AUTH}
    entraTenantId: ${ENTRA_TENANT_ID}
    entraClientId: ${ENTRA_CLIENT_ID}
    entraAudience: ${ENTRA_AUDIENCE}
    entraAuthority: ${ENTRA_AUTHORITY}
    entraIssuer: ${ENTRA_ISSUER}
    entraJwksUrl: ${ENTRA_JWKS_URL}
    entraJwksCacheTtlSeconds: ${ENTRA_JWKS_CACHE_TTL_SECONDS}
